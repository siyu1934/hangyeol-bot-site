<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한결봇 | Discord Server Bot</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, "Noto Sans KR", sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #263b70 0, transparent 35%),
        radial-gradient(circle at 80% 80%, #182c58 0, transparent 35%),
        #080b14;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: min(900px, 90%);
    text-align: center;
    padding: 70px 25px;
}

.badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid #5577c9;
    border-radius: 999px;
    color: #b9caff;
    font-size: 14px;
    margin-bottom: 25px;
    background: rgba(50, 75, 140, 0.15);
}

h1 {
    font-size: clamp(55px, 10vw, 100px);
    letter-spacing: 10px;
    margin-bottom: 12px;
    text-shadow: 0 0 35px rgba(100, 145, 255, 0.45);
}

.subtitle {
    font-size: 18px;
    color: #aeb9d5;
    margin-bottom: 45px;
}

.description {
    max-width: 650px;
    margin: auto;
    padding: 30px;
    border: 1px solid rgba(120, 150, 220, 0.25);
    border-radius: 24px;
    background: rgba(15, 22, 40, 0.65);
    backdrop-filter: blur(12px);
}

.description h2 {
    margin-bottom: 12px;
    font-size: 25px;
}

.description p {
    color: #aeb8cf;
    line-height: 1.7;
}

.features {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-top: 25px;
}

.feature {
    padding: 20px 10px;
    border-radius: 16px;
    background: rgba(35, 48, 80, 0.5);
    border: 1px solid rgba(110, 140, 210, 0.2);
    transition: 0.25s;
}

.feature:hover {
    transform: translateY(-5px);
    border-color: #688cff;
    background: rgba(55, 75, 125, 0.55);
}

.feature strong {
    display: block;
    margin-bottom: 7px;
}

.feature span {
    color: #9da9c3;
    font-size: 13px;
}

.invite {
    display: inline-block;
    margin-top: 40px;
    padding: 16px 35px;
    border-radius: 14px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: linear-gradient(135deg, #526fff, #765cff);
    box-shadow: 0 10px 35px rgba(80, 100, 255, 0.3);
    transition: 0.25s;
}

.invite:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 15px 45px rgba(90, 110, 255, 0.45);
}

footer {
    margin-top: 45px;
    color: #68738d;
    font-size: 13px;
}

footer a {
    color: #8c9ac0;
    text-decoration: none;
    margin: 0 8px;
}

@media (max-width: 650px) {
    .features {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        letter-spacing: 5px;
    }
}
</style>

</head>

<body>

<div class="container">

```
<div class="badge">DISCORD SERVER MANAGEMENT</div>

        한결봇과 함께 더 편리하게 서버를 관리하세요.

    <div class="features">
        <div class="feature">
            <strong>경고 관리</strong>
            <span>서버 경고 관리</span>
        </div>

        </div>

        <div class="feature">
            <strong>처벌 로그</strong>
            <span>관리 기록 확인</span>
        </div>

        <div class="feature">
            <strong>서버 관리</strong>
            <span>편리한 관리 기능</span>
        </div>
    </div>
</div>

</html>
