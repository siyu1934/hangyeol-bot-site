<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한결봇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
min-height:100vh;
font-family:Arial,"Noto Sans KR",sans-serif;
color:white;
background:radial-gradient(circle at 20% 20%,#304b91,transparent 35%),radial-gradient(circle at 80% 80%,#182d68,transparent 35%),#070a12;
display:flex;
justify-content:center;
align-items:center;
}
.page{width:min(900px,90%);padding:70px 20px;text-align:center}
.badge{display:inline-block;padding:8px 18px;border:1px solid #617ed1;border-radius:50px;color:#c4d1ff;font-size:13px}
h1{margin-top:25px;font-size:clamp(55px,11vw,100px);letter-spacing:10px;text-shadow:0 0 35px #5275ff}
.subtitle{margin-top:10px;color:#aeb9d2;font-size:18px}
.card{margin:50px auto 0;max-width:720px;padding:40px 30px;border:1px solid #33456f;border-radius:28px;background:#0e1425}
.card h2{font-size:27px;margin-bottom:12px}
.card p{color:#aeb8ce;line-height:1.8}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:30px}
.feature{padding:20px 8px;border-radius:17px;background:#19243d;border:1px solid #29395f}
.feature b{display:block;margin-bottom:7px}
.feature span{color:#8f9bb5;font-size:12px}
.button{display:inline-block;margin-top:38px;padding:16px 35px;border-radius:15px;color:white;text-decoration:none;font-weight:bold;background:linear-gradient(135deg,#5275ff,#755cff);box-shadow:0 12px 35px #334cff55}
footer{margin-top:40px;color:#657089;font-size:13px}
footer a{color:#8e9abc;text-decoration:none;margin:0 7px}
@media(max-width:650px){.features{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="page">

<div class="badge">DISCORD SERVER MANAGEMENT</div>

<h1>한결봇</h1>

<div class="subtitle">깔끔하고 간편한 Discord 서버 관리</div>

<div class="card">

<p>

한결봇과 함께 더 편리하게 서버를 관리하세요.
</p>

<div class="features">
<div class="feature"><b>경고 관리</b><span>경고 기록 관리</span></div>

<div class="feature"><b>서버 관리</b><span>편리한 관리 기능</span></div>

</div>

</html>
