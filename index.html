<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한결봇</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, "Noto Sans KR", sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 15% 15%, #304b91 0, transparent 30%),
        radial-gradient(circle at 85% 85%, #172d68 0, transparent 32%),
        #070a12;
}

.page {
    width: min(900px, 90%);
    margin: auto;
    padding: 80px 0 45px;
    text-align: center;
}

.badge {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid #617ed1;
    border-radius: 50px;
    color: #c4d1ff;
    background: rgba(70, 95, 170, .15);
    font-size: 13px;
    letter-spacing: 1px;
}

h1 {
    margin-top: 25px;
    font-size: clamp(55px, 11vw, 105px);
    letter-spacing: 12px;
    text-shadow: 0 0 35px rgba(90,130,255,.5);
}

.subtitle {
    margin-top: 10px;
    color: #aeb9d2;
    font-size: 18px;
}

.card {
    margin: 55px auto 0;
    max-width: 720px;
    padding: 42px 35px;
    border: 1px solid rgba(130,160,230,.25);
    border-radius: 28px;
    background: rgba(14,20,37,.75);
    box-shadow: 0 20px 70px rgba(0,0,0,.3);
}

.card h2 {
    font-size: 27px;
    margin-bottom: 12px;
}

.card p {
    color: #aeb8ce;
    line-height: 1.8;
}

.features {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 30px;
}

.feature {
    padding: 20px 8px;
    border-radius: 17px;
    background: rgba(45,60,100,.35);
    border: 1px solid rgba(110,140,210,.18);
    transition: .25s;
}

.feature:hover {
    transform: translateY(-6px);
    border-color: #718fff;
    background: rgba(65,85,140,.45);
}

.feature b {
    display: block;
    margin-bottom: 7px;
}

.feature span {
    color: #8f9bb5;
    font-size: 12px;
}

.button {
    display: inline-block;
    margin-top: 38px;
    padding: 16px 35px;
    border-radius: 15px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    background: linear-gradient(135deg,#5275ff,#755cff);
    box-shadow: 0 12px 35px rgba(75,100,255,.35);
    transition: .25s;
}

.button:hover {
    transform: translateY(-3px);
    box-shadow: 0 18px 45px rgba(75,100,255,.5);
}

footer {
    margin-top: 45px;
    color: #657089;
    font-size: 13px;
}

footer a {
    color: #8e9abc;
    text-decoration: none;
    margin: 0 7px;
}

@media (max-width: 650px) {
    .features {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        letter-spacing: 6px;
    }
}
</style>

</head>

<body>

<div class="page">

```
<div class="badge">DISCORD SERVER MANAGEMENT</div>

<h1>한결봇</h1>

<div class="subtitle">
    깔끔하고 간편한 Discord 서버 관리
</div>

    <h2>서버 관리를 더 간편하게.</h2>

        한결봇과 함께 더 편리하게 서버를 관리하세요.
    </p>

    <div class="features">

        <div class="feature">
            <b>경고 관리</b>
            <span>경고 기록 관리</span>
        </div>

        <div class="feature">
            <b>타임아웃</b>
            <span>간편한 제재</span>
        </div>

        <div class="feature">
            <b>처벌 로그</b>
            <span>관리 기록 확인</span>
        </div>

        <div class="feature">
            <b>서버 관리</b>
            <span>편리한 관리 기능</span>
        </div>

    </div>

    <a class="button" href="#">
        한결봇 서버에 추가하기
    </a>

</div>

<footer>
    <a href="privacy-policy.md">개인정보 처리방침</a>
    ·
    <a href="terms-of-service.md">이용약관</a>
    <br><br>
    © 2026 한결봇
</footer>
```

</div>

</body>
</html>
